version: 2

registries:
  papermc:
    type: maven-repository
    url: https://repo.papermc.io/repository/maven-public
  placeholderapi:
    type: maven-repository
    url: https://repo.extendedclip.com/releases
  faststats:
    type: maven-repository
    url: https://repo.faststats.dev/releases
  jitpack:
    type: maven-repository
    url: https://jitpack.io
  vaultunlocked:
    type: maven-repository
    url: https://repo.codemc.io/repository/creatorfromhell
  playerpoints:
    type: maven-repository
    url: https://repo.rosewooddev.io/repository/public
  oraxen:
    type: maven-repository
    url: https://repo.oraxen.com/releases
  nexo:
    type: maven-repository
    url: https://repo.nexomc.com/releases
  enginehub:
    type: maven-repository
    url: https://maven.enginehub.org/repo

updates:
  - package-ecosystem: gradle
    directory: /
    registries: "*"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "io.papermc.paper:paper-api"
      - dependency-name: "com.sk89q.worldedit:*"
      - dependency-name: "org.mariadb.jdbc:mariadb-java-client"
        update-types: ["version-update:semver-major"]
    groups:
      integration-apis:
        patterns:
          - "net.luckperms:*"
          - "me.clip:*"
          - "io.github.miniplaceholders:*"
          - "com.github.MilkBowl:*"
          - "net.milkbowl.vault:*"
          - "org.black_ixx:*"
          - "beer.devs:*"
          - "io.th0rgal:*"
          - "com.nexomc:*"
          - "com.github.Arcaniax-Development:*"
          - "com.sk89q.worldguard:*"
          - "com.sk89q.worldedit:*"
      jdbc:
        patterns:
          - "com.zaxxer:*"
          - "org.xerial:*"
          - "com.mysql:*"
          - "org.mariadb.jdbc:*"
          - "org.postgresql:*"
      test:
        patterns:
          - "org.junit*"
          - "org.assertj:*"
          - "org.mockito:*"
          - "org.testcontainers:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
