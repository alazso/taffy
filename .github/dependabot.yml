version: 2

registries:
  papermc:
    type: maven-repository
    url: https://repo.papermc.io/repository/maven-public
  placeholderapi:
    type: maven-repository
    url: https://repo.extendedclip.com/releases
  faststats:
    type: maven-repository
    url: https://repo.faststats.dev/releases
  jitpack:
    type: maven-repository
    url: https://jitpack.io
  citizens:
    type: maven-repository
    url: https://maven.citizensnpcs.co/repo
  vaultunlocked:
    type: maven-repository
    url: https://repo.codemc.io/repository/creatorfromhell
  playerpoints:
    type: maven-repository
    url: https://repo.rosewooddev.io/repository/public
  nightexpress:
    type: maven-repository
    url: https://repo.nightexpressdev.com/releases
  oraxen:
    type: maven-repository
    url: https://repo.oraxen.com/releases
  nexo:
    type: maven-repository
    url: https://repo.nexomc.com/releases
  enginehub:
    type: maven-repository
    url: https://maven.enginehub.org/repo
  fancyinnovations:
    type: maven-repository
    url: https://maven.fancyspaces.net/fancyinnovations/releases
  thenextlvl:
    type: maven-repository
    url: https://repo.thenextlvl.net/releases
  packetevents:
    type: maven-repository
    url: https://repo.codemc.io/repository/maven-releases
  momirealms:
    type: maven-repository
    url: https://repo.momirealms.net/releases
  phoenix:
    type: maven-repository
    url: https://nexus.phoenixdevt.fr/repository/maven-public

updates:
  - package-ecosystem: gradle
    directory: /
    registries: "*"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "io.papermc.paper:paper-api"
      - dependency-name: "org.gradle.toolchains.foojay-resolver-convention"
      - dependency-name: "com.sk89q.worldguard:*"
      - dependency-name: "com.sk89q.worldedit:*"
      - dependency-name: "org.mariadb.jdbc:mariadb-java-client"
        update-types: ["version-update:semver-major"]
    groups:
      integration-apis:
        patterns:
          - "net.luckperms:*"
          - "me.clip:*"
          - "io.github.miniplaceholders:*"
          - "com.github.MilkBowl:*"
          - "net.milkbowl.vault:*"
          - "org.black_ixx:*"
          - "su.nightexpress.excellenteconomy:*"
          - "su.nightexpress.nightcore:*"
          - "beer.devs:*"
          - "io.th0rgal:*"
          - "com.nexomc:*"
          - "com.github.Arcaniax-Development:*"
          - "net.momirealms:*"
          - "net.Indyuce:*"
          - "io.lumine:*"
          - "com.sk89q.worldguard:*"
          - "com.sk89q.worldedit:*"
          - "com.github.decentsoftware-eu:*"
          - "de.oliver:*"
          - "net.thenextlvl:*"
          - "com.github.HologramLib:*"
          - "com.github.retrooper:*"
          - "net.citizensnpcs:*"
          - "com.github.Pyrbu:*"
      jdbc:
        patterns:
          - "com.zaxxer:*"
          - "org.xerial:*"
          - "com.mysql:*"
          - "org.mariadb.jdbc:*"
          - "org.postgresql:*"
      test:
        patterns:
          - "org.junit*"
          - "org.assertj:*"
          - "org.mockito:*"
          - "org.testcontainers:*"

  - package-ecosystem: gradle
    directory: /tooling
    schedule:
      interval: weekly
    allow:
      - dependency-name: "com.gradleup.shadow:*"
      - dependency-name: "org.gradle.toolchains*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
