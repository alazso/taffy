name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A newer pull request run cancels the one before it. A running main build or snapshot upload is never cancelled;
# a main run still waiting in the group is replaced when a newer one queues.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build & test
        run: ./gradlew build --no-configuration-cache --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
          if-no-files-found: ignore

  snapshot:
    name: Publish snapshot
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: snapshot-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version and credentials
        id: gate
        env:
          ALAZSO_REPO_USER: ${{ secrets.ALAZSO_REPO_USER }}
          ALAZSO_REPO_TOKEN: ${{ secrets.ALAZSO_REPO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::notice::$VERSION is not a snapshot; the Release workflow publishes it from its tag."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$ALAZSO_REPO_USER" ] || [ -z "$ALAZSO_REPO_TOKEN" ]; then
            echo "::notice::ALAZSO_REPO_USER or ALAZSO_REPO_TOKEN is not set; $VERSION is not published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      # No Gradle User Home cache and no build cache: entries restored from other jobs and workflows
      # can hold outputs written while tests ran third-party code, and this job holds the publish secret.
      - name: Set up Gradle
        if: steps.gate.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Publish to repo.alaz.so/snapshots
        if: steps.gate.outputs.publish == 'true'
        env:
          ALAZSO_REPO_USER: ${{ secrets.ALAZSO_REPO_USER }}
          ALAZSO_REPO_TOKEN: ${{ secrets.ALAZSO_REPO_TOKEN }}
        run: ./gradlew publishAllPublicationsToAlazsoRepository --no-build-cache --no-configuration-cache --stacktrace
