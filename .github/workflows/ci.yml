name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Gradle on Java ${{ matrix.daemon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        daemon: [ "17", "25" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The last listed version becomes JAVA_HOME and runs Gradle; 25 stays installed as the compile toolchain.
      - name: Set up JDK 25 and the Gradle JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            ${{ matrix.daemon }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & test
        run: ./gradlew build --no-configuration-cache --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.daemon }}
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
          if-no-files-found: ignore
