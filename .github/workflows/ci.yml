name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Gradle on Java ${{ matrix.daemon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        daemon: [ "17", "25" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The last listed version becomes JAVA_HOME and runs Gradle; 25 stays installed as the compile toolchain.
      - name: Set up JDK 25 and the Gradle JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            ${{ matrix.daemon }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & test
        run: ./gradlew build --no-configuration-cache --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.daemon }}
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
          if-no-files-found: ignore

  snapshot:
    name: Publish snapshot
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check version and credentials
        id: gate
        env:
          ALAZSO_REPO_USER: ${{ secrets.ALAZSO_REPO_USER }}
          ALAZSO_REPO_TOKEN: ${{ secrets.ALAZSO_REPO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::notice::$VERSION is not a snapshot; the Release workflow publishes it from its tag."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$ALAZSO_REPO_USER" ] || [ -z "$ALAZSO_REPO_TOKEN" ]; then
            echo "::notice::ALAZSO_REPO_USER or ALAZSO_REPO_TOKEN is not set; $VERSION is not published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: steps.gate.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to repo.alaz.so/snapshots
        if: steps.gate.outputs.publish == 'true'
        env:
          ALAZSO_REPO_USER: ${{ secrets.ALAZSO_REPO_USER }}
          ALAZSO_REPO_TOKEN: ${{ secrets.ALAZSO_REPO_TOKEN }}
        run: ./gradlew publishAllPublicationsToAlazsoRepository --no-configuration-cache --stacktrace
