name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only; do not publish
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-verify-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.published.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: bash .github/scripts/resolve-release-version.sh

      - name: Skip if release already published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # A dry run builds even when the release is already published.
      - name: Set up JDK 25
        if: steps.published.outputs.skip != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: steps.published.outputs.skip != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build
        if: steps.published.outputs.skip != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: ./gradlew build --no-configuration-cache --stacktrace

      # The main sources of every module compile against the paper-api build of the oldest supported Paper server.
      - name: Compile main sources against taffy.paperFloor
        if: steps.published.outputs.skip != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          set -euo pipefail
          FLOOR="$(sed -n 's/^taffy.paperFloor=//p' gradle.properties | tr -d '[:space:]')"
          if [ -z "$FLOOR" ]; then
            echo "::error::gradle.properties sets no taffy.paperFloor."
            exit 1
          fi
          ./gradlew compileJava "-Ptaffy.paperApi=$FLOOR" --no-configuration-cache --stacktrace

  # One publish at a time across every ref. A dry run never reaches this job, so it cannot cancel one.
  publish:
    name: Publish
    needs: verify
    if: needs.verify.outputs.skip != 'true' && (github.event_name == 'push' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      # No Gradle User Home cache and no build cache: entries restored from other jobs and workflows
      # can hold outputs written while tests ran third-party code, and this job holds the publish secret.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # The GitHub Release is created last, so a failed Maven publish leaves the tag retryable.
      - name: Publish to repo.alaz.so
        env:
          ALAZSO_REPO_USER: ${{ secrets.ALAZSO_REPO_USER }}
          ALAZSO_REPO_TOKEN: ${{ secrets.ALAZSO_REPO_TOKEN }}
        run: ./gradlew publishAllPublicationsToAlazsoRepository --no-build-cache --no-configuration-cache --stacktrace

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail

          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            /^## \[/ {f=0}
            f
          ' CHANGELOG.md > release-notes.md || true

          if [ -s release-notes.md ]; then
            gh release create "$TAG" --verify-tag --title "v${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --title "v${VERSION}" --generate-notes
          fi
