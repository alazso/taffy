# Published as so.alaz.taffy:taffy-catalog and consumed by plugins as the `alaz` catalog.

[versions]
paper            = "26.3.build.256-stable"
annotations      = "26.1.0"
placeholderapi   = "2.12.3"
miniplaceholders = "3.2.0"
hikari           = "7.1.0"
sqlite           = "3.54.1.0"
mysql            = "26.10.0"
mariadb          = "3.5.11"
postgresql       = "42.7.14"
bstats           = "3.2.1"
faststats        = "0.33.0"
luckperms        = "5.5"
vault            = "1.7.1"
vaultunlocked    = "2.20"
playerpoints     = "3.3.5"
excellenteconomy = "2.8.0"  # the plugin CoinsEngine was renamed to
nightcore        = "2.16.7"  # the supertypes of the ExcellentEconomy API; its bridge module is for tests only
itemsadder       = "4.0.17"
oraxen           = "1.220.1"
nexo             = "1.30.2"
headdatabase     = "1.3.0"
craftengine      = "26.10"
mmoitems         = "6.10.1-SNAPSHOT"  # MMOItems-API is published as snapshots only
mythiclib        = "1.7.1-SNAPSHOT"   # the supertypes of the MMOItems classes; published as snapshots only
worldguard       = "7.0.20"
worldedit        = "7.4.4"  # the WorldEdit version WorldGuard 7.0.20 is built against
decentholograms  = "2.10.2"
fancyholograms   = "2.12.0"
holograms        = "1.5.4"
hologramlib      = "1.8.5"
citizens         = "2.0.44-SNAPSHOT"  # citizensapi is published as snapshots only
fancynpcs        = "2.12.1"
znpcsplus        = "2.0.0"  # the JitPack build of the tag 2.0.0, which holds the classes of lol.pyr:znpcsplus-api
packetevents     = "2.14.0"  # HologramLib's classes link only with PacketEvents present; tests only
comficonf        = "0.1.0"
junit            = "6.1.3"
assertj          = "3.27.7"
mockito          = "5.24.0"
testcontainers   = "1.21.4"

[libraries]
paper-api                 = { module = "io.papermc.paper:paper-api",                       version.ref = "paper" }
jetbrains-annotations     = { module = "org.jetbrains:annotations",                        version.ref = "annotations" }
placeholderapi            = { module = "me.clip:placeholderapi",                           version.ref = "placeholderapi" }
miniplaceholders-api      = { module = "io.github.miniplaceholders:miniplaceholders-api",  version.ref = "miniplaceholders" }
hikari                    = { module = "com.zaxxer:HikariCP",                              version.ref = "hikari" }
sqlite-jdbc               = { module = "org.xerial:sqlite-jdbc",                           version.ref = "sqlite" }
mysql-connector           = { module = "com.mysql:mysql-connector-j",                      version.ref = "mysql" }
mariadb-jdbc              = { module = "org.mariadb.jdbc:mariadb-java-client",             version.ref = "mariadb" }
postgresql-jdbc           = { module = "org.postgresql:postgresql",                        version.ref = "postgresql" }
bstats-bukkit             = { module = "org.bstats:bstats-bukkit",                         version.ref = "bstats" }
faststats-bukkit          = { module = "dev.faststats.metrics:bukkit",                     version.ref = "faststats" }
luckperms-api             = { module = "net.luckperms:api",                                version.ref = "luckperms" }
vault-api                 = { module = "com.github.MilkBowl:VaultAPI",                     version.ref = "vault" }
vaultunlocked-api         = { module = "net.milkbowl.vault:VaultUnlockedAPI",              version.ref = "vaultunlocked" }
playerpoints              = { module = "org.black_ixx:playerpoints",                       version.ref = "playerpoints" }
excellenteconomy          = { module = "su.nightexpress.excellenteconomy:ExcellentEconomy", version.ref = "excellenteconomy" }
nightcore-main            = { module = "su.nightexpress.nightcore:main",                   version.ref = "nightcore" }
nightcore-bridge          = { module = "su.nightexpress.nightcore:bridge",                 version.ref = "nightcore" }
itemsadder-api            = { module = "beer.devs:itemsadder-api",                         version.ref = "itemsadder" }
oraxen                    = { module = "io.th0rgal:oraxen",                                version.ref = "oraxen" }
nexo                      = { module = "com.nexomc:nexo",                                  version.ref = "nexo" }
headdatabase-api          = { module = "com.github.Arcaniax-Development:HeadDatabase-API", version.ref = "headdatabase" }
craftengine-bukkit        = { module = "net.momirealms:craft-engine-bukkit",               version.ref = "craftengine" }
craftengine-core          = { module = "net.momirealms:craft-engine-core",                 version.ref = "craftengine" }
mmoitems-api              = { module = "net.Indyuce:MMOItems-API",                         version.ref = "mmoitems" }
mythiclib                 = { module = "io.lumine:MythicLib-dist",                         version.ref = "mythiclib" }
worldguard-bukkit         = { module = "com.sk89q.worldguard:worldguard-bukkit",           version.ref = "worldguard" }
worldguard-core           = { module = "com.sk89q.worldguard:worldguard-core",             version.ref = "worldguard" }
worldedit-bukkit          = { module = "com.sk89q.worldedit:worldedit-bukkit",             version.ref = "worldedit" }
worldedit-core            = { module = "com.sk89q.worldedit:worldedit-core",               version.ref = "worldedit" }
decentholograms           = { module = "com.github.decentsoftware-eu:decentholograms",    version.ref = "decentholograms" }
fancyholograms            = { module = "de.oliver:FancyHolograms",                         version.ref = "fancyholograms" }
holograms                 = { module = "net.thenextlvl:holograms",                         version.ref = "holograms" }
hologramlib               = { module = "com.github.HologramLib:HologramLib",               version.ref = "hologramlib" }
citizens-api              = { module = "net.citizensnpcs:citizensapi",                     version.ref = "citizens" }
fancynpcs                 = { module = "de.oliver:FancyNpcs",                              version.ref = "fancynpcs" }
znpcsplus-api             = { module = "com.github.Pyrbu:ZNPCsPlus",                       version.ref = "znpcsplus" }
packetevents-api          = { module = "com.github.retrooper:packetevents-api",            version.ref = "packetevents" }
comficonf-api             = { module = "com.comficonf:comficonf-api",                      version.ref = "comficonf" }
junit-jupiter             = { module = "org.junit.jupiter:junit-jupiter",                  version.ref = "junit" }
junit-platform-launcher   = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core              = { module = "org.assertj:assertj-core",                         version.ref = "assertj" }
mockito-core              = { module = "org.mockito:mockito-core",                         version.ref = "mockito" }
testcontainers-junit      = { module = "org.testcontainers:junit-jupiter",                 version.ref = "testcontainers" }
testcontainers-mysql      = { module = "org.testcontainers:mysql",                         version.ref = "testcontainers" }
testcontainers-mariadb    = { module = "org.testcontainers:mariadb",                       version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql",                    version.ref = "testcontainers" }
